name: MyApp
services:
  db:
    container_name: MyApp-db
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5436:5432"]
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  mailpit:
    container_name: MyApp-mailpit
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  keycloak:
    container_name: MyApp-keycloak
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/idp_dev
      KC_DB_USERNAME: idp_dev
      KC_DB_PASSWORD: idp_dev_only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
    volumes:
      - ./themes:/opt/keycloak/themes
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
